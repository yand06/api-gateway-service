spring:
  security:
    oauth2:
      resourceserver:
        jwt:
#          issuer-uri: http://localhost:8081
  application:
    name: api-gateway-service
  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: vendor-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/vendor/**

        - id: purchasing-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/purchasing/**

server:
  port: 8080

secret:
  key: ${SECRET_KEY}

logging:
  level:
    org.springframework.security: DEBUG